# Mobile Grundwasser-Jahresvergleich split into two swipeable charts.
# Live source: Lovelace → Umwelt & Region → Grundwasser Poing.
# Requires apexcharts-card and swipe-card (HACS).
---
type: custom:swipe-card
parameters:
  effect: slide
  speed: 350
  spaceBetween: 16
  centeredSlides: true
  pagination:
    type: bullets
cards:
  - type: custom:apexcharts-card
    update_interval: 1min
    header:
      show: true
      title: Grundwasser Poing D83 – Jahresvergleich (2018–2022)
      show_states: false
    graph_span: 365d
    span:
      start: year
    all_series_config:
      type: line
      opacity: 0.5
      stroke_width: 1
      stroke_dash: 4
    apex_config:
      chart:
        height: 380
      stroke:
        width: 2
      dataLabels:
        enabled: false
      xaxis:
        title:
          text: Tag im Jahr
      yaxis:
        decimalsInFloat: 2
        title:
          text: Grundwasserstand (m ü. NN)
      legend:
        show: true
        position: bottom
    series:
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2018"
        offset: -2920d
        color: "#5ba3d0"
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2019"
        offset: -2555d
        color: "#6bb86b"
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2020"
        offset: -2190d
        color: "#b87bc4"
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2021"
        offset: -1825d
        color: "#d9945c"
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2022"
        offset: -1460d
        color: "#5ba8ad"
    grid_options:
      columns: full
      rows: 8
    visibility:
      - condition: screen
        media_query: "(max-width: 1023px)"

  - type: custom:apexcharts-card
    update_interval: 1min
    header:
      show: true
      title: Grundwasser Poing D83 – Jahresvergleich (2023–2026)
      show_states: false
    graph_span: 365d
    span:
      start: year
    all_series_config:
      type: line
      opacity: 0.5
      stroke_width: 1
      stroke_dash: 4
    apex_config:
      chart:
        height: 380
      stroke:
        width: 2
      dataLabels:
        enabled: false
      xaxis:
        title:
          text: Tag im Jahr
      yaxis:
        decimalsInFloat: 2
        title:
          text: Grundwasserstand (m ü. NN)
      legend:
        show: true
        position: bottom
    series:
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2023"
        offset: -1095d
        color: "#b8a85c"
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2024"
        offset: -730d
        color: "#c97a9a"
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2025"
        offset: -365d
        color: "#7a85b8"
      - entity: sensor.grundwasser_poing_d83_m_u_nn
        name: "2026"
        opacity: 1
        stroke_width: 5
        stroke_dash: 0
        color: "#ff9800"
        extend_to: false
    grid_options:
      columns: full
      rows: 8
    visibility:
      - condition: screen
        media_query: "(max-width: 1023px)"
visibility:
  - condition: screen
    media_query: "(max-width: 1023px)"
grid_options:
  columns: full
  rows: 8
